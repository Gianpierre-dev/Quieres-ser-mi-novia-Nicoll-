<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffd3e4">
  <title>Para Nicoll</title>
  <meta name="description" content="Una carta para Nicoll.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,700;1,6..96,700&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --rosa-pastel: #ffd3e4;
      --rosa-papel: #fff0f6;
      --lila: #dcc7ff;
      --lila-medio: #cbadfa;
      --lila-fuerte: #b993f5;
      --morado: #5b1fa6;
      --morado-oscuro: #35105f;
      --rojo: #e0173f;
      --rojo-oscuro: #b50d30;
      --rojo-texto: #d60f3b;
      --vino: #6a0824;
      --salida-suave: cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after { box-sizing: border-box; }

    ::selection { background: var(--rojo); color: var(--rosa-papel); }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding:
        max(20px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
      overflow: hidden;
      font-family: "Figtree", system-ui, sans-serif;
      color: var(--morado-oscuro);
      background: linear-gradient(135deg, var(--rosa-pastel), var(--lila), var(--rosa-pastel), var(--lila-fuerte));
      background-size: 300% 300%;
      animation: fondo-vivo 16s ease-in-out infinite;
      -webkit-tap-highlight-color: transparent;
    }

    [hidden] { display: none !important; }

    /* ---------- Fondo ---------- */

    .fondo, .cielo, #lienzo-confeti {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .fondo { overflow: hidden; }

    .mancha {
      position: absolute;
      width: 70vmax;
      height: 70vmax;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.55;
      animation: deriva 18s ease-in-out infinite alternate;
    }

    .mancha-rosa { background: #ff9fc4; top: -30vmax; left: -25vmax; }
    .mancha-morada { background: #a56bf0; bottom: -35vmax; right: -25vmax; animation-duration: 22s; animation-delay: -6s; }
    .mancha-roja { background: #ff6f8f; width: 40vmax; height: 40vmax; top: 35%; left: 45%; opacity: 0.3; animation-duration: 26s; animation-delay: -11s; }

    .cielo { overflow: hidden; z-index: 1; }

    .corazon-flotante {
      position: absolute;
      bottom: -48px;
      opacity: 0;
      animation: subir linear infinite;
    }

    .corazon-flotante svg { display: block; width: 100%; height: 100%; animation: balanceo 3s ease-in-out infinite alternate; }

    #lienzo-confeti { width: 100%; height: 100%; z-index: 5; }

    /* ---------- Escena 1: la carta sorpresa ---------- */

    .escena-carta {
      position: relative;
      z-index: 2;
      display: grid;
      justify-items: center;
      gap: 28px;
      text-align: center;
      animation: entrar 900ms var(--salida-suave) both;
    }

    .escena-carta.saliendo { animation: salir 450ms ease-in both; }

    .destinataria {
      margin: 0;
      font-family: "Bodoni Moda", "Didot", Georgia, serif;
      font-style: italic;
      font-weight: 700;
      font-size: clamp(2rem, 9vw, 2.75rem);
      line-height: 1.1;
      color: var(--vino);
    }

    .sobre {
      position: relative;
      width: min(78vw, 320px);
      aspect-ratio: 3 / 2;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
      perspective: 900px;
      touch-action: manipulation;
      filter: drop-shadow(0 22px 26px rgba(91, 31, 166, 0.4));
      animation: meneo 2.8s ease-in-out 1.2s infinite;
    }

    .sobre:focus-visible { outline: 3px solid var(--morado); outline-offset: 10px; border-radius: 12px; }

    .sobre.abierto { animation: none; cursor: default; }

    .sobre span { position: absolute; display: block; }

    .sobre-fondo {
      inset: 0;
      z-index: 1;
      background: var(--lila-fuerte);
      border-radius: 10px;
    }

    .sobre-hoja {
      left: 7%;
      right: 7%;
      top: 8%;
      height: 84%;
      z-index: 2;
      display: grid !important;
      place-items: center;
      background: var(--rosa-papel);
      border-radius: 6px;
      transition: transform 900ms var(--salida-suave) 450ms;
    }

    .sobre-hoja svg { width: 26%; fill: var(--rojo); opacity: 0.9; }

    .sobre-frente {
      inset: 0;
      z-index: 3;
      background: var(--lila);
      border-radius: 10px;
      clip-path: polygon(0 0, 50% 56%, 100% 0, 100% 100%, 0 100%);
    }

    .sobre-solapa {
      inset: 0;
      z-index: 4;
      background: var(--lila-medio);
      border-radius: 10px;
      clip-path: polygon(0 0, 100% 0, 50% 60%);
      transform-origin: 50% 0;
      transition: transform 700ms var(--salida-suave), z-index 0s linear 280ms;
    }

    .sobre-sello {
      left: 50%;
      top: 58%;
      z-index: 5;
      width: 22%;
      aspect-ratio: 1;
      display: grid !important;
      place-items: center;
      background: var(--rojo);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 6px 12px -4px rgba(181, 13, 48, 0.7);
      animation: latido-sello 1.2s ease-in-out infinite;
      transition: opacity 300ms ease;
    }

    .sobre-sello svg { width: 54%; fill: #fff; }

    .sobre.abierto .sobre-solapa { transform: rotateX(180deg); z-index: 1; }
    .sobre.abierto .sobre-hoja { transform: translateY(-62%); }
    .sobre.abierto .sobre-sello { opacity: 0; animation: none; }

    .pista {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
      color: var(--vino);
      animation: respirar 2s ease-in-out infinite;
    }

    .sobre.abierto ~ .pista { visibility: hidden; }

    /* ---------- Escena 2: la pregunta ---------- */

    .contenedor-tarjeta {
      position: relative;
      z-index: 2;
      width: min(100%, 400px);
    }

    .tarjeta {
      position: relative;
      padding: 44px 22px 34px;
      text-align: center;
      background: var(--rosa-papel);
      border: 2px solid var(--lila);
      border-radius: 28px;
      box-shadow:
        0 2px 0 #fff inset,
        0 18px 40px -12px rgba(91, 31, 166, 0.45),
        0 40px 80px -30px rgba(224, 23, 63, 0.35);
      animation: entrar 900ms var(--salida-suave) both;
    }

    .emblema {
      position: absolute;
      top: -30px;
      left: 50%;
      width: 60px;
      height: 60px;
      margin-left: -30px;
      display: grid;
      place-items: center;
      background: var(--rosa-papel);
      border: 2px solid var(--lila);
      border-radius: 50%;
      box-shadow: 0 8px 18px -8px rgba(91, 31, 166, 0.6);
    }

    .emblema svg {
      width: 30px;
      height: 30px;
      fill: var(--rojo);
      animation: latido 1.2s ease-in-out infinite;
    }

    .titulo {
      margin: 0;
      font-family: "Bodoni Moda", "Didot", Georgia, serif;
      font-style: italic;
      font-weight: 700;
      font-size: clamp(2.1rem, 10.5vw, 2.9rem);
      line-height: 1.1;
      letter-spacing: -0.01em;
      color: var(--rojo-texto);
      text-wrap: balance;
    }

    .titulo:focus { outline: none; }

    .palabra {
      display: inline-block;
      animation: revelar 800ms var(--salida-suave) both;
      animation-delay: calc(350ms + var(--orden) * 130ms);
    }

    .nombre {
      display: block;
      margin-top: 0.08em;
      font-style: normal;
      font-weight: 700;
      font-size: 1.28em;
      color: var(--rojo-texto);
      animation:
        revelar 900ms var(--salida-suave) both,
        respirar 2.6s ease-in-out infinite;
      animation-delay: 1000ms, 1900ms;
    }

    .acciones {
      display: flex;
      gap: 12px;
      margin-top: 30px;
    }

    .boton {
      position: relative;
      flex: 1 1 0;
      min-height: 54px;
      padding: 14px 20px;
      font: inherit;
      font-weight: 700;
      font-size: 1.125rem;
      border-radius: 999px;
      border: 2px solid transparent;
      cursor: pointer;
      touch-action: manipulation;
      animation: revelar 800ms var(--salida-suave) 1300ms backwards;
    }

    .boton:focus-visible {
      outline: 3px solid var(--morado);
      outline-offset: 3px;
    }

    .boton-si {
      background: var(--rojo);
      color: #fff;
      box-shadow: 0 10px 22px -8px rgba(224, 23, 63, 0.75);
      transition: background-color 200ms ease, transform 200ms var(--salida-suave);
    }

    .boton-si::after {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: inherit;
      border: 2px solid var(--rojo);
      animation: onda 1.8s ease-out infinite;
      pointer-events: none;
    }

    .boton-si:hover { background: var(--rojo-oscuro); transform: translateY(-2px); }
    .boton-si:active { transform: scale(0.96); }

    /* El botón "No" se escapa: su posición la mueve el script con transform. */
    .boton-no {
      z-index: 3;
      background: var(--rosa-papel);
      color: var(--rojo-texto);
      border-color: var(--lila-fuerte);
      transition: transform 380ms var(--salida-suave);
    }

    /* ---------- Escena 3: el modal ---------- */

    .velo {
      position: fixed;
      inset: 0;
      z-index: 4;
      display: grid;
      place-items: center;
      padding: 20px 16px;
      background: rgba(53, 16, 95, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      animation: aparecer-velo 400ms ease both;
    }

    .modal {
      position: relative;
      width: min(100%, 400px);
      padding: 48px 24px 34px;
      text-align: center;
      background: var(--rosa-papel);
      border: 2px solid var(--lila);
      border-radius: 28px;
      box-shadow: 0 30px 70px -20px rgba(53, 16, 95, 0.8);
      animation: brotar 700ms var(--salida-suave) both;
    }

    .modal:focus { outline: none; }

    .respuesta {
      margin: 0;
      font-family: "Bodoni Moda", "Didot", Georgia, serif;
      font-weight: 700;
      font-size: clamp(1.4rem, 6.4vw, 1.75rem);
      line-height: 1.3;
      color: var(--rojo-texto);
      text-wrap: balance;
    }

    .respuesta span {
      display: block;
      animation: revelar 900ms var(--salida-suave) both;
    }

    .respuesta span + span { margin-top: 0.65em; }
    .respuesta span:nth-child(1) { animation-delay: 450ms; }
    .respuesta span:nth-child(2) { animation-delay: 1500ms; }
    .respuesta span:nth-child(3) { animation-delay: 2900ms; }

    .respuesta .cierre {
      font-style: italic;
      font-size: 1.12em;
      color: var(--rojo-texto);
    }

    /* ---------- Pantallas más grandes ---------- */

    @media (min-width: 640px) {
      .contenedor-tarjeta { width: min(100%, 500px); }
      .tarjeta { padding: 60px 48px 44px; border-radius: 32px; }
      .titulo { font-size: 3.25rem; }
      .acciones { gap: 16px; margin-top: 40px; }
      .sobre { width: 380px; }
      .modal { width: min(100%, 500px); padding: 60px 48px 44px; }
      .respuesta { font-size: 2rem; }
    }

    /* ---------- Animaciones ---------- */

    @keyframes fondo-vivo {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    @keyframes deriva {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(12vmax, 8vmax) scale(1.2); }
    }

    @keyframes subir {
      0% { transform: translate(0, 0); opacity: 0; }
      10% { opacity: var(--opacidad); }
      85% { opacity: var(--opacidad); }
      100% { transform: translate(var(--desvio), -115vh); opacity: 0; }
    }

    @keyframes balanceo {
      from { transform: rotate(-18deg); }
      to { transform: rotate(18deg); }
    }

    @keyframes meneo {
      0%, 60%, 100% { transform: rotate(0) translateY(0); }
      10% { transform: rotate(-3deg) translateY(-6px); }
      20% { transform: rotate(3deg) translateY(-6px); }
      30% { transform: rotate(-2deg) translateY(-3px); }
      40% { transform: rotate(2deg) translateY(0); }
    }

    @keyframes entrar {
      from { opacity: 0; transform: scale(0.82) translateY(30px); filter: blur(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
    }

    @keyframes salir {
      from { opacity: 1; transform: scale(1); }
      to { opacity: 0; transform: scale(1.15); }
    }

    @keyframes brotar {
      0% { opacity: 0; transform: scale(0.6) rotate(-4deg); }
      60% { opacity: 1; transform: scale(1.05) rotate(1deg); }
      100% { opacity: 1; transform: scale(1) rotate(0); }
    }

    @keyframes aparecer-velo {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes revelar {
      from { opacity: 0; transform: translateY(14px); filter: blur(6px); }
      to { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    @keyframes latido {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.28); }
      30% { transform: scale(1); }
      45% { transform: scale(1.18); }
      60% { transform: scale(1); }
    }

    @keyframes latido-sello {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      15% { transform: translate(-50%, -50%) scale(1.18); }
      30% { transform: translate(-50%, -50%) scale(1); }
      45% { transform: translate(-50%, -50%) scale(1.1); }
      60% { transform: translate(-50%, -50%) scale(1); }
    }

    @keyframes respirar {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes onda {
      from { transform: scale(1); opacity: 0.8; }
      to { transform: scale(1.22, 1.5); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
      .cielo, #lienzo-confeti { display: none; }
    }
  </style>
</head>
<body>
  <div class="fondo" aria-hidden="true">
    <div class="mancha mancha-rosa"></div>
    <div class="mancha mancha-morada"></div>
    <div class="mancha mancha-roja"></div>
  </div>
  <div class="cielo" id="cielo" aria-hidden="true"></div>
  <canvas id="lienzo-confeti" aria-hidden="true"></canvas>

  <main>
    <section class="escena-carta" id="escena-carta">
      <p class="destinataria">Para Nicoll</p>
      <button type="button" class="sobre" id="sobre" aria-label="Abrir la carta">
        <span class="sobre-fondo"></span>
        <span class="sobre-hoja">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.3 2.9 4.5 6.6 4.5c2.2 0 3.9 1.2 5.4 3.2 1.5-2 3.2-3.2 5.4-3.2 3.7 0 5.7 3.8 4.2 7.3C19.5 16.4 12 21 12 21z"/></svg>
        </span>
        <span class="sobre-frente"></span>
        <span class="sobre-solapa"></span>
        <span class="sobre-sello">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.3 2.9 4.5 6.6 4.5c2.2 0 3.9 1.2 5.4 3.2 1.5-2 3.2-3.2 5.4-3.2 3.7 0 5.7 3.8 4.2 7.3C19.5 16.4 12 21 12 21z"/></svg>
        </span>
      </button>
      <p class="pista">Toca el sobre para abrirlo</p>
    </section>

    <section class="contenedor-tarjeta" id="escena-pregunta" hidden>
      <div class="tarjeta">
        <div class="emblema" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.3 2.9 4.5 6.6 4.5c2.2 0 3.9 1.2 5.4 3.2 1.5-2 3.2-3.2 5.4-3.2 3.7 0 5.7 3.8 4.2 7.3C19.5 16.4 12 21 12 21z"/></svg>
        </div>
        <h1 class="titulo" id="titulo" tabindex="-1">
          <span class="palabra" style="--orden: 0">¿Quieres</span>
          <span class="palabra" style="--orden: 1">ser</span>
          <span class="palabra" style="--orden: 2">mi</span>
          <span class="palabra" style="--orden: 3">novia</span>
          <span class="nombre">Nicoll?</span>
        </h1>
        <div class="acciones">
          <button type="button" class="boton boton-si" id="boton-si">Sí</button>
          <button type="button" class="boton boton-no" id="boton-no">No</button>
        </div>
      </div>
    </section>
  </main>

  <div class="velo" id="velo" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="texto-respuesta" tabindex="-1">
      <div class="emblema" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.3 2.9 4.5 6.6 4.5c2.2 0 3.9 1.2 5.4 3.2 1.5-2 3.2-3.2 5.4-3.2 3.7 0 5.7 3.8 4.2 7.3C19.5 16.4 12 21 12 21z"/></svg>
      </div>
      <p class="respuesta" id="texto-respuesta">
        <span>Lo sabía mi amor.</span>
        <span>Yo también quiero estar contigo hasta el fin de los tiempos.</span>
        <span class="cierre">Te amo como no tienes idea.</span>
      </p>
    </div>
  </div>

  <script src="confeti.min.js"></script>
  <script>
    const TRAZO_CORAZON = 'M12 21s-7.5-4.6-9.6-9.2C.9 8.3 2.9 4.5 6.6 4.5c2.2 0 3.9 1.2 5.4 3.2 1.5-2 3.2-3.2 5.4-3.2 3.7 0 5.7 3.8 4.2 7.3C19.5 16.4 12 21 12 21z';
    const COLORES = ['#e0173f', '#ff7aa8', '#b993f5', '#5b1fa6', '#ffffff'];
    const CORAZONES_INICIALES = 14;
    const CORAZONES_FESTEJO = 22;
    const INTERVALO_FESTEJO_MS = 2600;
    const DURACION_APERTURA_MS = 1700;
    const DURACION_SALIDA_MS = 450;
    const MARGEN_PANTALLA = 12;
    const DISTANCIA_MINIMA_ESCAPE = 130;
    const INTENTOS_ESCAPE = 40;

    const escenaCarta = document.getElementById('escena-carta');
    const sobre = document.getElementById('sobre');
    const escenaPregunta = document.getElementById('escena-pregunta');
    const titulo = document.getElementById('titulo');
    const botonSi = document.getElementById('boton-si');
    const botonNo = document.getElementById('boton-no');
    const velo = document.getElementById('velo');
    const modal = document.getElementById('modal');
    const cielo = document.getElementById('cielo');
    const lienzoConfeti = document.getElementById('lienzo-confeti');

    const sinMovimiento = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const aleatorio = (minimo, maximo) => minimo + Math.random() * (maximo - minimo);
    const elegir = (lista) => lista[Math.floor(Math.random() * lista.length)];
    const esperar = (milisegundos) => new Promise((resolver) => setTimeout(resolver, sinMovimiento ? 0 : milisegundos));

    /* ---------- Corazones de fondo ---------- */

    function crearCorazonFlotante() {
      const corazon = document.createElement('span');
      const lado = aleatorio(14, 34);
      corazon.className = 'corazon-flotante';
      corazon.style.left = `${aleatorio(0, 94)}%`;
      corazon.style.width = `${lado}px`;
      corazon.style.height = `${lado}px`;
      corazon.style.animationDuration = `${aleatorio(7, 14)}s`;
      corazon.style.animationDelay = `${aleatorio(-14, 0)}s`;
      corazon.style.setProperty('--desvio', `${aleatorio(-60, 60)}px`);
      corazon.style.setProperty('--opacidad', aleatorio(0.45, 0.9).toFixed(2));
      corazon.innerHTML = `<svg viewBox="0 0 24 24" fill="${elegir(COLORES)}"><path d="${TRAZO_CORAZON}"/></svg>`;
      cielo.appendChild(corazon);
    }

    function poblarCielo(cantidad) {
      if (sinMovimiento) return;
      for (let indice = 0; indice < cantidad; indice += 1) crearCorazonFlotante();
    }

    /* ---------- Confeti de corazones ---------- */

    function crearLanzador() {
      if (sinMovimiento || typeof confetti !== 'function') return null;
      const lanzar = confetti.create(lienzoConfeti, { resize: true, useWorker: true });
      const formaCorazon = confetti.shapeFromPath({ path: TRAZO_CORAZON });
      return (opciones) => lanzar({
        shapes: [formaCorazon],
        colors: COLORES,
        scalar: 1.7,
        ticks: 260,
        ...opciones,
      });
    }

    const lanzarCorazones = crearLanzador();

    function festejar() {
      if (!lanzarCorazones) return;

      lanzarCorazones({ particleCount: 110, spread: 110, startVelocity: 45, origin: { x: 0.5, y: 0.6 } });
      setTimeout(() => lanzarCorazones({ particleCount: 60, angle: 60, spread: 70, origin: { x: 0, y: 0.75 } }), 250);
      setTimeout(() => lanzarCorazones({ particleCount: 60, angle: 120, spread: 70, origin: { x: 1, y: 0.75 } }), 450);

      setInterval(() => {
        lanzarCorazones({
          particleCount: 28,
          spread: 80,
          startVelocity: 30,
          origin: { x: aleatorio(0.15, 0.85), y: aleatorio(0.3, 0.7) },
        });
      }, INTERVALO_FESTEJO_MS);
    }

    /* ---------- Escena 1: abrir la carta ---------- */

    async function abrirCarta() {
      if (sobre.classList.contains('abierto')) return;
      sobre.classList.add('abierto');
      sobre.disabled = true;
      if (lanzarCorazones) {
        lanzarCorazones({ particleCount: 24, spread: 70, startVelocity: 26, scalar: 1.2, origin: { x: 0.5, y: 0.5 } });
      }

      await esperar(DURACION_APERTURA_MS);
      escenaCarta.classList.add('saliendo');
      await esperar(DURACION_SALIDA_MS);

      escenaCarta.hidden = true;
      escenaPregunta.hidden = false;
      titulo.focus();
    }

    /* ---------- Escena 2: el "No" se escapa ---------- */

    let posicionBase = null;

    function seSuperponen(izquierda, arriba, ancho, alto, rectangulo, holgura) {
      return izquierda < rectangulo.right + holgura
        && izquierda + ancho > rectangulo.left - holgura
        && arriba < rectangulo.bottom + holgura
        && arriba + alto > rectangulo.top - holgura;
    }

    function escaparBotonNo() {
      const actual = botonNo.getBoundingClientRect();
      if (!posicionBase) posicionBase = { izquierda: actual.left, arriba: actual.top };

      const rectanguloSi = botonSi.getBoundingClientRect();
      const maximoX = Math.max(MARGEN_PANTALLA, window.innerWidth - actual.width - MARGEN_PANTALLA);
      const maximoY = Math.max(MARGEN_PANTALLA, window.innerHeight - actual.height - MARGEN_PANTALLA);

      let destinoX = MARGEN_PANTALLA;
      let destinoY = MARGEN_PANTALLA;
      for (let intento = 0; intento < INTENTOS_ESCAPE; intento += 1) {
        destinoX = aleatorio(MARGEN_PANTALLA, maximoX);
        destinoY = aleatorio(MARGEN_PANTALLA, maximoY);
        const lejos = Math.hypot(destinoX - actual.left, destinoY - actual.top) > DISTANCIA_MINIMA_ESCAPE;
        const pisaElSi = seSuperponen(destinoX, destinoY, actual.width, actual.height, rectanguloSi, 16);
        if (lejos && !pisaElSi) break;
      }

      const desplazamientoX = destinoX - posicionBase.izquierda;
      const desplazamientoY = destinoY - posicionBase.arriba;
      botonNo.style.transform = `translate(${desplazamientoX}px, ${desplazamientoY}px)`;
    }

    function reiniciarBotonNo() {
      posicionBase = null;
      botonNo.style.transform = '';
    }

    /* ---------- Escena 3: el modal ---------- */

    function aceptar() {
      escenaPregunta.inert = true;
      velo.hidden = false;
      modal.focus();
      poblarCielo(CORAZONES_FESTEJO);
      festejar();
    }

    sobre.addEventListener('click', abrirCarta);
    botonSi.addEventListener('click', aceptar);

    // Escritorio: se escapa al pasar el cursor. Celular y teclado: se escapa al tocarlo.
    botonNo.addEventListener('pointerenter', (evento) => {
      if (evento.pointerType === 'mouse') escaparBotonNo();
    });
    botonNo.addEventListener('click', (evento) => {
      evento.preventDefault();
      escaparBotonNo();
    });
    window.addEventListener('resize', reiniciarBotonNo);

    poblarCielo(CORAZONES_INICIALES);
  </script>
</body>
</html>
